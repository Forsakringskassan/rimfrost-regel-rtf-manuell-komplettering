quarkus.index-dependency.rimfrost-framework-regel-tests.group-id=se.fk.rimfrost.framework.regel
quarkus.index-dependency.rimfrost-framework-regel-tests.artifact-id=rimfrost-framework-regel
quarkus.index-dependency.rimfrost-framework-regel-tests.classifier=tests

quarkus.index-dependency.rimfrost-framework-regel-komplettering-tests.group-id=se.fk.rimfrost.framework.regel.komplettering
quarkus.index-dependency.rimfrost-framework-regel-komplettering-tests.artifact-id=rimfrost-framework-regel-komplettering
quarkus.index-dependency.rimfrost-framework-regel-komplettering-tests.classifier=tests

application.config.path=src/test/resources/config-test.yaml

# Persistence off since OUL interface is mocked in tests
quarkus.flyway.enabled=false
quarkus.hibernate-orm.active=false
quarkus.datasource.devservices.enabled=false

#Incoming
mp.messaging.incoming.regel-requests.connector=smallrye-in-memory
mp.messaging.incoming.operativt-uppgiftslager-status-notification.connector=smallrye-in-memory
mp.messaging.incoming.regel-oul-cancelled.connector=smallrye-in-memory

#Outgoing
mp.messaging.outgoing.regel-responses.connector=smallrye-in-memory

# Kafka off for tests because of in-memory connector
quarkus.kafka.devservices.enabled=false
